<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/style.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Início</a>
        <a href="projetos.html">Projetos</a>
        <a href="cadastro.html">Cadastre-se</a>
      </nav>
    </header>

    <main>
      <section>
        <h1>Faça parte da Pata Viva</h1>

        <p>
          Cadastre-se para fazer parte da nossa rede de apoio e contribuir com
          ações de proteção, cuidado e bem-estar animal.
        </p>

        <img
          src="IMG/cão e gato.jpg"
          alt="cão e gato"
          width="500"
          height="300"
        />
      </section>

      <form>
        <fieldset>
          <legend>Dados pessoais</legend>

          <label for="nome">Nome completo</label>
          <input
            type="text"
            id="nome"
            name="nome"
            autocomplete="name"
            required
          />

          <label for="cpf">CPF</label>
          <input
            type="text"
            id="cpf"
            name="cpf"
            inputmode="numeric"
            maxlength="14"
            placeholder="000.000.000-00"
            required
          />

          <label for="nascimento">Data de nascimento</label>
          <input type="date" id="nascimento" name="nascimento" required />
        </fieldset>
      </form>
    </main>

    <footer></footer>

    <script src="JS/main.js"></script>
  </body>
</html>
